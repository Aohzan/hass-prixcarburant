name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: Aohzan/.github/.github/workflows/dependabot-auto-merge.yaml@v1
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
