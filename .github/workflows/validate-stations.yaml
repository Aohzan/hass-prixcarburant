name: Validate Stations JSON

on:
  pull_request_target:
    paths:
      - "custom_components/prix_carburant/stations_name.json"

jobs:
  validate-stations:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write

    steps:
      # Only the base branch (trusted code) is checked out: code from the PR is never executed,
      # the PR stations_name.json file is only read as data by the base validation script.
      - name: Checkout base repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Fetch stations_name.json from the PR
        run: |
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git show "$HEAD_SHA:custom_components/prix_carburant/stations_name.json" > "$RUNNER_TEMP/stations_name.json"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Validate stations_name.json
        run: python scripts/validate_stations.py "$RUNNER_TEMP/stations_name.json"

      - name: Check if PR only modifies stations_name.json
        id: check-pr-files
        run: |
          changed_files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' | sort -u)
          echo "Changed files:"
          echo "$changed_files"
          if [[ "$changed_files" == "custom_components/prix_carburant/stations_name.json" ]]; then
            echo "only_stations=true" >> "$GITHUB_OUTPUT"
          else
            echo "only_stations=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      # Those steps will auto-approve and merge the PR if it only modifies the stations_name.json file
      - name: Auto-approve PR
        if: steps.check-pr-files.outputs.only_stations == 'true'
        uses: hmarr/auto-approve-action@v4
        with:
          review-message: "Stations data automated approved PR"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge PR once other checks pass
        if: steps.check-pr-files.outputs.only_stations == 'true'
        run: |
          echo "Waiting for other checks to complete..."
          for i in {1..120}; do
            # Skipped checks (e.g. Dependabot auto-merge) must not block the merge
            NOT_OK=$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json name,state \
              --jq '[.[] | select(.name != "validate-stations") | select(.state != "SUCCESS" and .state != "SKIPPED" and .state != "NEUTRAL")] | length' || true)
            if [[ "$NOT_OK" == "0" ]]; then
              # Direct merge: auto-merge cannot be enabled as master has no required status checks
              gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash \
                --match-head-commit "$HEAD_SHA" \
                --subject "chore: update stations data (#$PR_NUMBER)"
              exit 0
            fi
            sleep 10
          done
          echo "Timeout: Other checks did not complete successfully within 20 minutes."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
