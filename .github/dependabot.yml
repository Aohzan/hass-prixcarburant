version: 2
updates:
  # No runtime requirement (manifest.json): only development dependencies
  - package-ecosystem: uv
    directory: /
    # Only uv.lock: the lower bounds of pyproject.toml are the oldest supported versions
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      dev-tools:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
